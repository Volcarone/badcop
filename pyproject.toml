[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badcop"
version = "0.1.1"
description = "Chase unpaid invoices with an escalating, tone-controlled reminder ladder. You stay the good cop."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BadCop contributors"}]
keywords = ["invoice", "reminder", "dunning", "accounts-receivable", "freelance", "late-payment", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
badcop = "badcop.cli:main"

[project.urls]
Homepage = "https://github.com/badcop-app/badcop"

[tool.setuptools.packages.find]
where = ["src"]
